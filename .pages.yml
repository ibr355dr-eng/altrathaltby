media:
  - name: images
    label: الصور
    input: media/images
    output: /media/images
    categories: [image]
    rename: safe
  - name: files
    label: الملفات
    input: media/files
    output: /media/files
    extensions: [html, pdf]
    rename: safe

content:
  - name: research
    label: البحوث
    type: collection
    path: content/research
    format: yaml-frontmatter
    exclude: [.gitkeep]
    filename: "{fields.slug}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, category, date, draft]
    fields:
      - name: title
        label: عنوان البحث
        type: string
        required: true
      - name: slug
        label: رابط البحث
        description: "كلمة أو كلمتان بالإنجليزية بلا مسافات، مثل spleen أو black-bile. تظهر في الرابط: altrathaltby.com/research/spleen"
        type: string
        required: true
      - name: category
        label: التصنيف
        type: reference
        required: true
        options:
          collection: categories
          value: "{fields.slug}"
          label: "{fields.name}"
          search: "name"
      - name: summary
        label: نبذة قصيرة
        description: سطران يظهران تحت العنوان في الصفحة الرئيسية ونتائج Google.
        type: text
        required: true
      - name: date
        label: تاريخ النشر
        type: date
        required: true
      - name: cover
        label: صورة الغلاف (اختيارية)
        type: image
        options:
          media: images
      - name: html_file
        label: ملف البحث الجاهز (اختياري)
        description: إن كان البحث صفحة HTML جاهزة أو ملف PDF فارفعه هنا، ويُعرض بدل النص أدناه.
        type: file
        options:
          media: files
      - name: access
        label: الإتاحة
        type: select
        default: free
        options:
          values:
            - name: free
              label: مجاني
            - name: paid
              label: مدفوع
      - name: pay_url
        label: رابط الدفع (للبحث المدفوع)
        type: string
      - name: draft
        label: مسودة (لا يُنشر)
        type: boolean
        default: false
      - name: body
        label: نص البحث
        description: "في البحث المدفوع يُعرض مجاناً أول ثلاث فقرات، أو ما قبل سطر فيه ‎[[المزيد]]‎ إن وضعته."
        type: rich-text
        options:
          media: images

  - name: categories
    label: التصنيفات
    type: collection
    path: content/categories
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: name
      sort: order
      order: asc
      fields: [name, order]
    fields:
      - name: name
        label: اسم التصنيف
        type: string
        required: true
      - name: slug
        label: رابط التصنيف
        description: كلمة بالإنجليزية بلا مسافات، مثل herbs.
        type: string
        required: true
      - name: description
        label: وصف قصير
        type: text
      - name: order
        label: الترتيب
        description: رقم الترتيب في الصفحة الرئيسية (١ أولاً).
        type: number
        default: 10

  - name: settings
    label: إعدادات الموقع ووسائل التواصل
    type: file
    path: content/settings.json
    format: json
    fields:
      - {name: name, label: اسم الموقع, type: string}
      - {name: tagline, label: الشعار النصي, type: string}
      - {name: description, label: وصف الموقع لمحركات البحث, type: text}
      - {name: about, label: نص صفحة «عن الموقع», type: text}
      - {name: email, label: البريد, type: string}
      - {name: whatsapp, label: "رقم واتساب (بالمفتاح الدولي بلا + ولا مسافات، مثل 9665XXXXXXXX)", type: string}
      - {name: whatsapp_message, label: الرسالة الافتراضية في واتساب, type: text}
      - {name: x, label: رابط إكس, type: string}
      - {name: instagram, label: رابط إنستغرام, type: string}
      - {name: tiktok, label: رابط تيك توك, type: string}
      - {name: telegram, label: رابط تيليجرام, type: string}
      - {name: youtube, label: رابط يوتيوب, type: string}
      - {name: snapchat, label: رابط سناب شات, type: string}

settings:
  content:
    merge: true
